<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img" aria-label="Chartered accountancy illustration — ledger, calculator and growth chart">
  <defs>
    <radialGradient id="gGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".16"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity=".05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gSheet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f7f3"/>
    </linearGradient>
    <linearGradient id="gGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2e7d32"/>
      <stop offset="100%" stop-color="#1b5e20"/>
    </linearGradient>
    <linearGradient id="gDeep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e5c26"/>
      <stop offset="100%" stop-color="#0e3d1c"/>
    </linearGradient>
    <linearGradient id="gAmber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd54f"/>
      <stop offset="100%" stop-color="#f9a825"/>
    </linearGradient>
    <filter id="fCard" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="9" stdDeviation="9" flood-color="#04210e" flood-opacity=".38"/>
    </filter>
  </defs>

  <!-- Backdrop glow + dotted ring + sparkles -->
  <circle cx="280" cy="185" r="170" fill="url(#gGlow)"/>
  <circle cx="280" cy="180" r="168" fill="none" stroke="#ffffff" stroke-opacity=".18" stroke-width="1.5" stroke-dasharray="2 9" stroke-linecap="round"/>
  <g stroke="#ffffff" stroke-opacity=".45" stroke-width="1.6" stroke-linecap="round">
    <path d="M137 26h8M141 22v8"/>
    <path d="M496 66h8M500 62v8"/>
    <path d="M26 154h7M29.5 150.5v7"/>
  </g>
  <g fill="#ffffff" fill-opacity=".5">
    <circle cx="38" cy="86" r="2"/>
    <circle cx="520" cy="150" r="2"/>
    <circle cx="252" cy="18" r="2"/>
    <circle cx="34" cy="236" r="2"/>
    <circle cx="544" cy="228" r="2"/>
  </g>

  <!-- Growth chart panel (behind) -->
  <g transform="translate(396 34) rotate(5 65 50)">
    <rect x="0" y="0" width="130" height="100" rx="12" fill="#fbfdfb" stroke="#dfe9e2" filter="url(#fCard)"/>
    <rect x="12" y="12" width="46" height="5" rx="2.5" fill="#cfdcd4"/>
    <line x1="12" y1="60" x2="118" y2="60" stroke="#eef3ef" stroke-width="1.5" stroke-dasharray="3 4"/>
    <line x1="12" y1="88" x2="118" y2="88" stroke="#e3ece5" stroke-width="2"/>
    <rect x="14" y="62" width="15" height="26" rx="4" fill="#a5d6a7"/>
    <rect x="38" y="50" width="15" height="38" rx="4" fill="#66bb6a"/>
    <rect x="62" y="36" width="15" height="52" rx="4" fill="#43a047"/>
    <rect x="86" y="22" width="15" height="66" rx="4" fill="#1b5e20"/>
    <path d="M18 56 L44 44 L70 30 L100 12" fill="none" stroke="#f9a825" stroke-width="3" stroke-linecap="round"/>
    <polygon points="108,8 98,9 103,19" fill="#f9a825"/>
    <circle cx="18" cy="56" r="3" fill="#fff" stroke="#f9a825" stroke-width="2"/>
    <circle cx="44" cy="44" r="3" fill="#fff" stroke="#f9a825" stroke-width="2"/>
    <circle cx="70" cy="30" r="3" fill="#fff" stroke="#f9a825" stroke-width="2"/>
  </g>

  <!-- Ledger / statement of accounts -->
  <g transform="translate(88 64) rotate(-4 75 104)">
    <rect x="0" y="0" width="150" height="208" rx="12" fill="url(#gSheet)" stroke="#dfe9e2" filter="url(#fCard)"/>
    <path d="M0 12 A12 12 0 0 1 12 0 H138 A12 12 0 0 1 150 12 V42 H0 Z" fill="url(#gGreen)"/>
    <circle cx="24" cy="21" r="11" fill="#f9a825"/>
    <text x="24" y="26" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" fill="#143a12">&#8377;</text>
    <rect x="44" y="14" width="58" height="5" rx="2.5" fill="#ffffff" fill-opacity=".95"/>
    <rect x="44" y="25" width="36" height="4" rx="2" fill="#cfe6d4" fill-opacity=".85"/>
    <rect x="16" y="58" width="118" height="5" rx="2.5" fill="#d8e4dc"/>
    <rect x="16" y="70" width="96" height="5" rx="2.5" fill="#d8e4dc"/>
    <rect x="16" y="82" width="110" height="5" rx="2.5" fill="#d8e4dc"/>
    <rect x="16" y="94" width="84" height="5" rx="2.5" fill="#d8e4dc"/>
    <rect x="16" y="106" width="110" height="10" rx="5" fill="#fff2d6" stroke="#f2d190" stroke-width="1"/>
    <rect x="24" y="108.5" width="70" height="5" rx="2.5" fill="#dcae4b"/>
    <rect x="16" y="122" width="88" height="5" rx="2.5" fill="#d8e4dc"/>
    <line x1="16" y1="138" x2="134" y2="138" stroke="#cfdcd4" stroke-width="1.5"/>
    <rect x="16" y="148" width="118" height="14" rx="3" fill="#eef5f0"/>
    <rect x="24" y="153" width="58" height="5" rx="2.5" fill="#9fb4a5"/>
    <rect x="92" y="150.5" width="34" height="9" rx="4.5" fill="#2e7d32"/>
    <rect x="98" y="153.5" width="22" height="3" rx="1.5" fill="#ffffff" fill-opacity=".9"/>
    <rect x="16" y="172" width="11" height="11" rx="3" fill="#f9a825"/>
    <path d="M18.5 177.5 l3 3 l5 -6" fill="none" stroke="#143a12" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="34" y="175" width="70" height="5" rx="2.5" fill="#d8e4dc"/>
    <!-- Amber seal with ribbons -->
    <g transform="translate(118 180)">
      <polygon points="-10,4 -13,22 -6,18 -2,26 0,6" fill="#d98a00"/>
      <polygon points="10,4 13,22 6,18 2,26 0,6" fill="#d98a00"/>
      <circle cx="0" cy="0" r="14" fill="url(#gAmber)" stroke="#ffffff" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="9.5" fill="none" stroke="#ffffff" stroke-opacity=".55" stroke-width="1"/>
      <path d="M-4 0 l3 3 l6 -6" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Rupee coin stack (foreground left) -->
  <g transform="translate(108 268)">
    <ellipse cx="0" cy="20" rx="36" ry="7" fill="#04210e" fill-opacity=".32"/>
    <ellipse cx="0" cy="19" rx="26" ry="8" fill="#c47f00"/>
    <rect x="-26" y="14" width="52" height="5" fill="#c47f00"/>
    <ellipse cx="0" cy="14" rx="26" ry="8" fill="#f9a825" stroke="#d18d00" stroke-width="1"/>
    <ellipse cx="0" cy="10" rx="26" ry="8" fill="#c47f00"/>
    <rect x="-26" y="5" width="52" height="5" fill="#c47f00"/>
    <ellipse cx="0" cy="5" rx="26" ry="8" fill="#f9a825" stroke="#d18d00" stroke-width="1"/>
    <ellipse cx="0" cy="1" rx="26" ry="8" fill="#c47f00"/>
    <rect x="-26" y="-4" width="52" height="5" fill="#c47f00"/>
    <ellipse cx="0" cy="-4" rx="26" ry="8" fill="#ffd54f" stroke="#d18d00" stroke-width="1"/>
    <text x="0" y="0" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" fill="#5b3a00">&#8377;</text>
  </g>

  <!-- Calculator -->
  <g transform="translate(302 90) rotate(4 59 85)">
    <rect x="0" y="0" width="118" height="170" rx="14" fill="url(#gDeep)" stroke="#ffffff" stroke-opacity=".12" filter="url(#fCard)"/>
    <rect x="10" y="12" width="98" height="34" rx="8" fill="#05260f" stroke="#ffffff" stroke-opacity=".08"/>
    <text x="100" y="34" text-anchor="end" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="700" fill="#ffd54f">12,40,500</text>
    <rect x="18" y="38" width="20" height="2" rx="1" fill="#43a047" fill-opacity=".85"/>
    <g fill="#ffffff" fill-opacity=".13">
      <rect x="10" y="58" width="22" height="18" rx="6"/><rect x="36" y="58" width="22" height="18" rx="6"/><rect x="62" y="58" width="22" height="18" rx="6"/><rect x="88" y="58" width="22" height="18" rx="6" fill="#f9a825"/>
      <rect x="10" y="82" width="22" height="18" rx="6"/><rect x="36" y="82" width="22" height="18" rx="6"/><rect x="62" y="82" width="22" height="18" rx="6"/><rect x="88" y="82" width="22" height="18" rx="6"/>
      <rect x="10" y="106" width="22" height="18" rx="6"/><rect x="36" y="106" width="22" height="18" rx="6"/><rect x="62" y="106" width="22" height="18" rx="6"/><rect x="88" y="106" width="22" height="18" rx="6"/>
      <rect x="10" y="130" width="22" height="18" rx="6"/><rect x="36" y="130" width="22" height="18" rx="6"/><rect x="62" y="130" width="22" height="18" rx="6"/><rect x="88" y="130" width="22" height="18" rx="6" fill="#2e7d32"/>
    </g>
    <g font-family="'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="700" fill="#ffffff" fill-opacity=".85" text-anchor="middle">
      <text x="99" y="71">&#247;</text><text x="21" y="95" fill-opacity=".6">&#215;</text><text x="47" y="95" fill-opacity=".6">&#8722;</text><text x="73" y="95" fill-opacity=".6">+</text><text x="99" y="143">=</text>
    </g>
  </g>

  <!-- Floating chip: shield check (top left) -->
  <g transform="translate(70 40)">
    <rect x="-17" y="-17" width="34" height="34" rx="10" fill="#ffffff" fill-opacity=".14" stroke="#ffffff" stroke-opacity=".3"/>
    <path d="M0 -9 L8 -5.5 V1 C8 6 4 9.5 0 11 C-4 9.5 -8 6 -8 1 V-5.5 Z" fill="#f9a825"/>
    <path d="M-3.5 0.5 L-1 3 L4 -2.5" fill="none" stroke="#143a12" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Floating chip: rupee coin (top centre) -->
  <g transform="translate(262 46)">
    <circle r="13" fill="#ffd54f" stroke="#ffffff" stroke-width="2"/>
    <text y="5" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="700" fill="#143a12">&#8377;</text>
  </g>

  <!-- Floating chip: balance scale (bottom right) -->
  <g transform="translate(474 282)">
    <circle r="26" fill="#ffffff" fill-opacity=".14" stroke="#ffffff" stroke-opacity=".3"/>
    <g stroke="#ffd54f" stroke-width="2.5" stroke-linecap="round" fill="none">
      <line x1="0" y1="-12" x2="0" y2="12"/>
      <line x1="-8" y1="12" x2="8" y2="12"/>
      <line x1="-13" y1="-10" x2="13" y2="-10"/>
      <line x1="-13" y1="-10" x2="-13" y2="-4"/>
      <line x1="13" y1="-10" x2="13" y2="-4"/>
    </g>
    <path d="M-19 -4 A6 6 0 0 0 -7 -4 Z" fill="#ffd54f"/>
    <path d="M7 -4 A6 6 0 0 0 19 -4 Z" fill="#ffd54f"/>
    <circle cy="-13" r="2" fill="#ffd54f"/>
  </g>
</svg>
