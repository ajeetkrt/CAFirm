# Render Blueprint — free web service + generated secrets.
# The PostgreSQL database is external (Neon free tier): create it first and
# paste its connection string into DATABASE_URL when Render asks.
services:
  - type: web
    name: cafirm
    runtime: docker
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: FLASK_CONFIG
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false            # paste the Neon connection string here
      - key: SEED_ADMIN_PASSWORD
        generateValue: true
      - key: SEED_STAFF_PASSWORD
        generateValue: true
